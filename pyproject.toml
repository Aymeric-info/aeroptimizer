[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aeroptimizer"
version = "0.1.0"
description = "Differentiable aero-structural topology optimization for FDM-printed drone arms/chassis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.3",
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
vtk = ["pyvista>=0.43", "meshio>=5.3"]
mma = ["nlopt>=2.7"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: long-running tests (3D, benchmarks)",
    "gpu: requires a CUDA device",
    "reference: compares against an independent NumPy reference in tests/reference",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.mypy]
python_version = "3.11"
packages = ["aeroptimizer"]
mypy_path = "src"
ignore_missing_imports = true
